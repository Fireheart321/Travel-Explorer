<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Now - Travel Explorer</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

  <header>
    <nav class="bg-white shadow-md">
      <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">

        <a href="index.html" class="text-2xl font-bold text-blue-600 flex items-center gap-2">
          <span>🌍</span> Travel Explorer</a>

        <div class="space-x-6">
          <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
          <a href="destinations.html" class="hover:text-blue-600 transition">Destinations</a>
          <a href="booking.html" class="text-blue-600 font-semibold">Book Now</a>
        </div>

      </div>
    </nav>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-10 flex-grow w-full flex items-center justify-center">

    <div class="w-full max-w-lg">

      <section class="text-center mb-8">
        <h1 class="text-4xl font-bold text-gray-900 mb-3">✈️ Book Your Trip</h1>
        <p class="text-gray-600 max-w-md mx-auto">
          Fill in your details below and we'll take care of the rest.
        </p>
      </section>

      <div class="bg-white rounded-xl shadow-md p-8">

        <!-- Confirmation message (hidden initially) -->
        <div id="confirmationMsg"
             class="hidden bg-green-50 border border-green-300 text-green-800 rounded-lg p-4 mb-6 text-sm">
        </div>

        <form id="bookingForm" novalidate>

          <!-- Full Name -->
          <div class="mb-5">
            <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              placeholder="John Doe"
              class="w-full p-3 border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            />
            <p id="fullNameError" class="hidden text-red-600 text-xs mt-1"></p>
          </div>

          <!-- Email -->
          <div class="mb-5">
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="john@example.com"
              class="w-full p-3 border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            />
            <p id="emailError" class="hidden text-red-600 text-xs mt-1"></p>
          </div>

          <!-- Destination -->
          <div class="mb-5">
            <label for="destination" class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
            <select
              id="destination"
              name="destination"
              class="w-full p-3 border border-gray-300 rounded-lg bg-white
                     focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            >
              <option value="">Select a destination</option>
              <option value="Addis Ababa, Ethiopia">Addis Ababa, Ethiopia</option>
              <option value="Lalibela, Ethiopia">Lalibela, Ethiopia</option>
              <option value="Zanzibar, Tanzania">Zanzibar, Tanzania</option>
              <option value="Istanbul, Turkey">Istanbul, Turkey</option>
              <option value="Paris, France">Paris, France</option>
              <option value="Bali, Indonesia">Bali, Indonesia</option>
            </select>
            <p id="destinationError" class="hidden text-red-600 text-xs mt-1"></p>
          </div>

          <!-- Travel Date -->
          <div class="mb-6">
            <label for="travelDate" class="block text-sm font-medium text-gray-700 mb-1">Travel Date</label>
            <input
              type="date"
              id="travelDate"
              name="travelDate"
              class="w-full p-3 border border-gray-300 rounded-lg
                     focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
            />
            <p id="travelDateError" class="hidden text-red-600 text-xs mt-1"></p>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold
                   py-3 rounded-lg transition"
          >
            Confirm Booking
          </button>

        </form>
      </div>

      <p class="text-center text-gray-400 text-xs mt-4">We'll never share your information with anyone else.</p>
    </div>

  </main>

  <footer class="bg-gray-800 text-gray-300 py-6 text-center text-sm">
    <p>&copy; 2026 Travel Explorer. All rights reserved.</p>
  </footer>

  <script>
    const form = document.getElementById('bookingForm');

    const fields = {
      fullName: {
        input: document.getElementById('fullName'),
        error: document.getElementById('fullNameError'),
      },
      email: {
        input: document.getElementById('email'),
        error: document.getElementById('emailError'),
      },
      destination: {
        input: document.getElementById('destination'),
        error: document.getElementById('destinationError'),
      },
      travelDate: {
        input: document.getElementById('travelDate'),
        error: document.getElementById('travelDateError'),
      },
    };

    const confirmationMsg = document.getElementById('confirmationMsg');

    // Pre-fill destination if it arrives via URL, e.g. booking.html?destination=Paris%2C%20France
    const params = new URLSearchParams(window.location.search);
    const prefillDestination = params.get('destination');
    if (prefillDestination) {
      const match = [...fields.destination.input.options]
        .find(opt => opt.value.toLowerCase() === prefillDestination.toLowerCase());
      if (match) fields.destination.input.value = match.value;
    }

    function showError(field, message) {
      field.input.classList.add('border-red-500');
      field.error.textContent = message;
      field.error.classList.remove('hidden');
    }

    function clearError(field) {
      field.input.classList.remove('border-red-500');
      field.error.textContent = '';
      field.error.classList.add('hidden');
    }

    function isValidEmail(value) {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(value);
    }

    function isFutureDate(value) {
      if (!value) return false;
      const selected = new Date(value + 'T00:00:00');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return selected > today;
    }

    function validateFullName() {
      const value = fields.fullName.input.value.trim();
      if (value.length === 0) {
        showError(fields.fullName, 'Full name is required.');
        return false;
      }
      if (value.length < 3) {
        showError(fields.fullName, 'Full name must be at least 3 characters.');
        return false;
      }
      clearError(fields.fullName);
      return true;
    }

    function validateEmail() {
      const value = fields.email.input.value.trim();
      if (value.length === 0) {
        showError(fields.email, 'Email address is required.');
        return false;
      }
      if (!isValidEmail(value)) {
        showError(fields.email, 'Please enter a valid email address.');
        return false;
      }
      clearError(fields.email);
      return true;
    }

    function validateDestination() {
      const value = fields.destination.input.value.trim();
      if (value.length === 0) {
        showError(fields.destination, 'Please select a destination.');
        return false;
      }
      clearError(fields.destination);
      return true;
    }

    function validateTravelDate() {
      const value = fields.travelDate.input.value;
      if (value.length === 0) {
        showError(fields.travelDate, 'Travel date is required.');
        return false;
      }
      if (!isFutureDate(value)) {
        showError(fields.travelDate, 'Travel date must be a future date.');
        return false;
      }
      clearError(fields.travelDate);
      return true;
    }

    fields.fullName.input.addEventListener('input', validateFullName);
    fields.email.input.addEventListener('input', validateEmail);
    fields.destination.input.addEventListener('change', validateDestination);
    fields.travelDate.input.addEventListener('change', validateTravelDate);
    fields.travelDate.input.addEventListener('input', validateTravelDate);

    form.addEventListener('submit', function (event) {
      event.preventDefault();

      confirmationMsg.classList.add('hidden');

      const isNameValid = validateFullName();
      const isEmailValid = validateEmail();
      const isDestinationValid = validateDestination();
      const isDateValid = validateTravelDate();

      if (isNameValid && isEmailValid && isDestinationValid && isDateValid) {
        const emailValue = fields.email.input.value.trim();

        confirmationMsg.innerHTML =
          '🎉 Booking confirmed! We\'ll contact you at <strong>' + emailValue + '</strong> shortly.';
        confirmationMsg.classList.remove('hidden');

        form.reset();
        Object.values(fields).forEach(clearError);

        confirmationMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  </script>

</body>
</html>
